version: 2

updates:
  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        update-types: ["minor", "patch"]

  # Bun workspace root. The single bun.lock lives here, so every workspace
  # manifest must be updated from "/" - a per-workspace entry bumps
  # package.json without the lockfile and CI fails on --frozen-lockfile.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
      # Pinned back on 2026-11-20: @vite-pwa/astro 2.x dropped the default export
      # (portal astro.config) and @lucide/astro >=1.73 dropped icons the apps import.
      # Lift these once the code is adapted (see docs/plan/progress.md).
      - dependency-name: "@vite-pwa/astro"
      - dependency-name: "vite-plugin-pwa"
      - dependency-name: "@lucide/astro"
    groups:
      workspace-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile base images
  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /apps/web-admin
    schedule:
      interval: daily
