version: 2

updates:
  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        update-types: ["minor", "patch"]

  # Backend workspace
  - package-ecosystem: bun
    directory: /apps/backend
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  # Web admin workspace
  - package-ecosystem: bun
    directory: /apps/web-admin
    schedule:
      interval: daily
    ignore:
      - dependency-name: "typescript"
    groups:
      webadmin-minor-patch:
        update-types: ["minor", "patch"]

  # Shared packages
  - package-ecosystem: bun
    directory: /packages/common
    schedule:
      interval: daily
    ignore:
      - dependency-name: "typescript"
    groups:
      common-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: /packages/ui
    schedule:
      interval: daily
    ignore:
      - dependency-name: "typescript"
    groups:
      ui-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile base images
  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /apps/web-admin
    schedule:
      interval: daily
