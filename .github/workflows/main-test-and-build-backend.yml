name: Main Test and Build Backend

on:
  push:
    branches: ["main"]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-test-and-build-backend.yml"
  pull_request:
    branches: ["main"]

env:
  HUSKY: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for backend-related changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - "apps/backend/**"
              - "packages/**"
              - "package.json"
              - "bun.lock"
              - "bunfig.toml"
              - "turbo.json"
              - ".github/workflows/main-test-and-build-backend.yml"

  lint:
    name: Lint Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build @ims-erp/common
        run: bun run --cwd packages/common build

      - name: Lint backend
        run: bun run --cwd apps/backend lint

      - name: Typecheck backend
        run: bun run --cwd apps/backend typecheck

  test:
    name: Unit Test Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create test env
        run: |
          cat > .env <<'EOF'
          APP_NAME=ci-test
          APP_ID=ci-test
          APP_SECRET=ci-test-secret-not-real-0000000000
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=ci_test
          S3_ACCESS_KEY=ci
          S3_SECRET_KEY=ci
          S3_REGION=us-east-1
          S3_BUCKET=ci
          SMTP_HOST=localhost
          SMTP_USER=ci
          SMTP_PASSWORD=ci
          BETTER_AUTH_SECRET=ci-test-secret-not-real-0000000000000000
          EOF
        working-directory: apps/backend

      - name: Run unit tests with coverage
        run: |
          mkdir -p test-result coverage
          bun run test:cov -- --reporter=junit --reporter-outfile=./test-result/junit.xml
        working-directory: apps/backend

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          report_paths: apps/backend/test-result/junit.xml
          require_tests: true

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v7.2.2
        if: (!cancelled())
        with:
          coverage-files: apps/backend/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          artifact-name: backend-coverage-report
          title-prefix: Backend
          working-directory: apps/backend

  docker:
    name: Docker Build Backend
    needs: [lint, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ims-erp-backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: false
          tags: ims-erp-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true

