name: Main Test and Build Backend

on:
  push:
    branches: ["main"]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-test-and-build-backend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-test-and-build-backend.yml"

env:
  HUSKY: 0

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build @ims-erp/common
        run: bun run --cwd packages/common build

      - name: Lint backend
        run: bun run --cwd apps/backend lint

      - name: Typecheck backend
        run: bun run --cwd apps/backend typecheck

  test:
    name: Unit Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create test env
        run: |
          cat > .env <<'EOF'
          APP_NAME=ci-test
          APP_ID=ci-test
          APP_SECRET=ci-test-secret-not-real-0000000000
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=ci_test
          S3_ACCESS_KEY=ci
          S3_SECRET_KEY=ci
          S3_REGION=us-east-1
          S3_BUCKET=ci
          SMTP_HOST=localhost
          SMTP_USER=ci
          SMTP_PASSWORD=ci
          BETTER_AUTH_SECRET=ci-test-secret-not-real-0000000000000000
          EOF
        working-directory: apps/backend

      - name: Run unit tests with coverage
        run: |
          mkdir -p test-result coverage
          bun test ./test/unit \
            --reporter=junit --reporter-outfile=./test-result/junit.xml \
            --coverage --coverage-reporter=text --coverage-reporter=lcov \
            --coverage-dir=./coverage | tee coverage.txt
        working-directory: apps/backend

      - name: Build coverage comment
        run: |
          {
            echo "### Backend unit test coverage"
            echo ""
            echo '```'
            # Strip ANSI codes and keep the coverage table (from the header line down)
            sed -e 's/\x1b\[[0-9;]*m//g' coverage.txt | sed -n '/^ *File /,$p'
            echo '```'
          } > coverage-comment.md
        working-directory: apps/backend

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: (!cancelled())
        with:
          name: backend-test-results
          path: apps/backend/test-result/junit.xml
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: (!cancelled())
        with:
          name: backend-coverage-report
          path: apps/backend/coverage-comment.md
          retention-days: 7

  docker:
    name: Docker Build Backend
    needs: [lint, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ims-erp-backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: false
          tags: ims-erp-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true

  report:
    name: Publish Test Results and Coverage
    needs: test
    if: (!cancelled()) && needs.test.result != 'skipped'
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: backend-test-results
          path: test-result

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          report_paths: test-result/junit.xml
          require_tests: true

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage-report
          path: coverage

      - name: Comment coverage on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && (!cancelled())
        with:
          header: backend-coverage
          path: coverage/coverage-comment.md
