name: Main Test and Build Backend

on:
  push:
    branches: ["main"]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-test-and-build-backend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-test-and-build-backend.yml"

env:
  HUSKY: 0

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build @ims-erp/common
        run: bun run --cwd packages/common build

      - name: Lint backend
        run: bun run --cwd apps/backend lint

      - name: Typecheck backend
        run: bun run --cwd apps/backend typecheck

      - name: Run tests
        run: |
          mkdir -p test-result
          bun test --reporter=junit --reporter-outfile=./test-result/junit.xml
        working-directory: apps/backend

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: (!cancelled())
        with:
          name: backend-test-results
          path: apps/backend/test-result/junit.xml
          retention-days: 7

      - name: Smoke build (Bun can bundle entry)
        run: bun build --target=bun --outdir=./test-result/build-check src/index.ts
        working-directory: apps/backend

  docker:
    name: Docker Build Backend
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ims-erp-backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: false
          tags: ims-erp-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true

  report:
    name: Publish Test Results
    needs: build
    if: (!cancelled()) && needs.build.result != 'skipped'
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: backend-test-results
          path: test-result

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          report_paths: test-result/junit.xml
          require_tests: true
