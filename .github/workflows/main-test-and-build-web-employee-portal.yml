name: Main Test and Build Web Employee Portal

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web-employee-portal/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-test-and-build-web-employee-portal.yml"
  pull_request:
    branches: ["main"]

env:
  HUSKY: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web-employee-portal: ${{ steps.filter.outputs.web-employee-portal }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for web-employee-portal-related changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web-employee-portal:
              - "apps/web-employee-portal/**"
              - "packages/**"
              - "package.json"
              - "bun.lock"
              - "bunfig.toml"
              - "turbo.json"
              - ".github/workflows/main-test-and-build-web-employee-portal.yml"

  lint:
    name: Lint Web Employee Portal
    needs: changes
    if: needs.changes.outputs.web-employee-portal == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint web-employee-portal
        run: bun run --cwd apps/web-employee-portal lint

  test:
    name: Unit Test Web Employee Portal
    needs: changes
    if: needs.changes.outputs.web-employee-portal == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build @ims-erp/common
        run: bun run --cwd packages/common build

      - name: Run unit tests with coverage
        run: |
          mkdir -p test-result coverage
          bun run test:cov -- --reporter=junit --reporter-outfile=./test-result/junit.xml
        working-directory: apps/web-employee-portal

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          report_paths: apps/web-employee-portal/test-result/junit.xml
          require_tests: true

      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v7.2.3
        if: (!cancelled())
        with:
          coverage-files: apps/web-employee-portal/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          artifact-name: web-employee-portal-coverage-report
          title-prefix: Web Employee Portal
          working-directory: apps/web-employee-portal

  docker:
    name: Docker Build Web Employee Portal
    needs: [lint, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ims-erp-web-employee-portal image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web-employee-portal/Dockerfile
          push: false
          tags: ims-erp-web-employee-portal:ci
          cache-from: type=gha,scope=web-employee-portal
          cache-to: type=gha,scope=web-employee-portal,mode=max,ignore-error=true

