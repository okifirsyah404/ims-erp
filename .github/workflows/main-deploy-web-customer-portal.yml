name: Main Deploy Web Customer Portal

on:
  pull_request:
    types: [closed]
    branches: ["main"]
    paths:
      - "apps/web-customer-portal/**"
      - "packages/common/**"
      - "packages/design-tokens/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-deploy-web-customer-portal.yml"

env:
  HUSKY: 0

jobs:
  build-and-push:
    name: Build and Push Web Customer Portal
    if: github.event.pull_request.merged == true
    environment: main-deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: okifirsyah404/ims-erp-customer-portal
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev

      # `astro:env` client values are inlined into the bundle at build time.
      # Unset variables fall back to the app's production defaults.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web-customer-portal/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_WEB_URL=${{ vars.PUBLIC_WEB_URL }}
            PUBLIC_SUPPORT_WHATSAPP=${{ vars.PUBLIC_SUPPORT_WHATSAPP }}
            PUBLIC_SUPPORT_PHONE=${{ vars.PUBLIC_SUPPORT_PHONE }}
          cache-from: type=gha,scope=web-customer-portal
          cache-to: type=gha,scope=web-customer-portal,mode=max,ignore-error=true
          platforms: linux/amd64
