name: Main Deploy Web Employee Portal

on:
  pull_request:
    types: [closed]
    branches: ["main"]
    paths:
      - "apps/web-employee/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-deploy-web-employee.yml"

env:
  HUSKY: 0

jobs:
  build-and-push:
    name: Build and Push Web Employee Portal
    if: github.event.pull_request.merged == true
    environment: main-deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Push to GitHub Container Registry with the workflow's GITHUB_TOKEN.
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate short SHA
        id: short-sha
        run: echo "short-sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/okifirsyah404/ims-erp-web-employee
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web-employee/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-employee
          cache-to: type=gha,scope=web-employee,mode=max,ignore-error=true
          platforms: linux/amd64
