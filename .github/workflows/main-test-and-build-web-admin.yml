name: Main Test and Build Web Admin

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web-admin/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-test-and-build-web-admin.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web-admin/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-test-and-build-web-admin.yml"

env:
  HUSKY: 0

jobs:
  lint:
    name: Lint Web Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint web-admin
        run: bun run --cwd apps/web-admin lint

  test:
    name: Unit Test Web Admin
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build @ims-erp/common
        run: bun run --cwd packages/common build

      - name: Build @ims-erp/common
        run: bun run --cwd packages/common build

      - name: Run unit tests with coverage
        run: |
          mkdir -p test-result coverage
          bun run test:cov -- --reporter=junit --reporter-outfile=./test-result/junit.xml
        working-directory: apps/web-admin

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          report_paths: apps/web-admin/test-result/junit.xml
          require_tests: true

      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v7.2.2
        if: (!cancelled())
        with:
          coverage-files: apps/web-admin/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          artifact-name: web-admin-coverage-report
          working-directory: apps/web-admin

  docker:
    name: Docker Build Web Admin
    needs: [lint, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ims-erp-web-admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web-admin/Dockerfile
          push: false
          tags: ims-erp-web-admin:ci
          cache-from: type=gha,scope=web-admin
          cache-to: type=gha,scope=web-admin,mode=max,ignore-error=true

