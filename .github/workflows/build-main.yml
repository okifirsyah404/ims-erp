# This workflow lints, builds, and tests the monorepo on every push/PR to main.

name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  HUSKY: 0

jobs:
  # Lint, typecheck, and build all workspaces via Turborepo
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  # Build Docker images to validate the Dockerfiles (no push)
  docker:
    name: Docker Build (${{ matrix.app }})
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        app: [backend, web-admin]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ims-erp-${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: ims-erp-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # Run backend unit tests with coverage and publish results on the PR
  test-backend:
    name: Test Backend
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: |
          cd apps/backend
          bun run test:report
        continue-on-error: true

      - name: Publish Test Results
        uses: MishaKav/jest-coverage-comment@main
        if: (!cancelled())
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-summary-path: apps/backend/test-result/coverage/coverage-summary.json
          junitxml-path: apps/backend/test-result/jest-junit/jest-junit.xml
          coverage-path: apps/backend/test-result/coverage/coverage.txt
          title: "Test Results"
          summary-title: "Test Coverage Summary"
          junitxml-title: "Vitest JUnit Report"
