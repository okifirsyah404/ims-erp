name: Main Deploy Web Landing

on:
  pull_request:
    types: [closed]
    branches: ["main"]
    paths:
      - "apps/web-landing/**"
      - "packages/common/**"
      - "packages/design-tokens/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/main-deploy-web-landing.yml"

env:
  HUSKY: 0

jobs:
  build-and-push:
    name: Build and Push Web Landing
    if: github.event.pull_request.merged == true
    environment: main-deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Push to GitHub Container Registry with the workflow's GITHUB_TOKEN.
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/okifirsyah404/ims-erp-landing
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev

      # `astro:env` client values are inlined into the bundle at build time.
      # Unset variables fall back to the app's production defaults.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web-landing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_WEB_URL=${{ vars.PUBLIC_WEB_URL }}
            PUBLIC_CUSTOMER_URL=${{ vars.PUBLIC_CUSTOMER_URL }}
            PUBLIC_WHATSAPP_NUMBER=${{ vars.PUBLIC_WHATSAPP_NUMBER || '6281280002020' }}
          cache-from: type=gha,scope=web-landing
          cache-to: type=gha,scope=web-landing,mode=max,ignore-error=true
          platforms: linux/amd64
