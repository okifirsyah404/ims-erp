# Deployment compose file: pulls published images from Docker Hub.
# For building from source (local development), use:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Application images are published by the main-deploy-*.yml workflows on
# merges to main. IMAGE_TAG defaults to the dev channel tag.

name: ims-erp

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ims_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ims_erp}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ims_erp} -d ${POSTGRES_DB:-ims_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ponytail: port published for local access; remove when a dedicated
    # DB host is used. Add when: backend runs off-host.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    image: docker.io/okifirsyah404/ims-erp-backend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      INSTANCE_ENV: ${INSTANCE_ENV:-development}
      INSTANCE_TIMEZONE: ${TZ:-Asia/Jakarta}
      APP_NAME: ${APP_NAME:?APP_NAME is required}
      APP_ID: ${APP_ID:?APP_ID is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_URL: ${APP_URL:-}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ims_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ims_erp}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BETTER_AUTH_SECRET: ${APP_SECRET:?APP_SECRET is required (used as BETTER_AUTH_SECRET)}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-admin:
    image: docker.io/okifirsyah404/ims-erp-web-admin:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_PORT:-80}:80"

volumes:
  postgres-data:
  redis-data:
