name: ims-erp

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ims_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ims_erp}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ims_erp} -d ${POSTGRES_DB:-ims_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ponytail: port published for local access; remove when a dedicated
    # DB host is used. Add when: backend runs off-host.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  web-admin:
    image: ghcr.io/okifirsyah404/ims-erp-web-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_PORT:-80}:80"

volumes:
  postgres-data:
  redis-data:
