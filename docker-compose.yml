# Deployment compose file: pulls published images from GitHub Container
# Registry (ghcr.io/okifirsyah404/*). Pulling needs `docker login ghcr.io`
# with a token that has read:packages while the packages are private.
# For building from source (local development), use:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Application images are published by the main-deploy-*.yml workflows on
# merges to main. IMAGE_TAG defaults to the dev channel tag.

name: ims-erp

services:
  postgres:
    # postgis/postgis (not `postgres`): the project module measures field
    # attendance distance with PostGIS (`ST_Distance` / `ST_DWithin`).
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ims_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ims_erp}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      # postgres:18+ images use major-version subdirectories under
      # /var/lib/postgresql; mounting the parent enables pg_upgrade --link.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ims_erp} -d ${POSTGRES_DB:-ims_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DiceBear HTTP API rendering the generated user avatars. Internal only (no
  # published port): the backend reaches it as http://dicebear:3000. Set
  # AVATAR_API_URL to https://api.dicebear.com instead to use the public API.
  dicebear:
    image: dicebear/api:4
    restart: unless-stopped
    environment:
      PORT: 3000
      # Only the v10 style set is needed (the backend requests 10.x/initials).
      VERSIONS: 10
      # Avatars are deterministic per seed, so they are safe to cache hard.
      CACHE_CONTROL_AVATARS: 31536000
      CACHE_CONTROL_STYLES: 31536000
      # Avatar bytes go straight to S3; EXIF tagging is pure overhead.
      PNG_EXIF: 0
      # Single-threaded by default; raise for avatar-heavy deployments.
      WORKERS: ${DICEBEAR_WORKERS:-1}
    # The image runs as a non-root user; only these mount points need to be
    # writable.
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      # The image ships node but no curl/wget; probe the API with a one-liner.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/10.x/initials/png?seed=health&size=1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/okifirsyah404/ims-erp-backend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: ${TZ:-Asia/Jakarta}
      APP_NAME: ${APP_NAME:?APP_NAME is required}
      APP_ID: ${APP_ID:?APP_ID is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_URL: ${APP_URL:-}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-}
      # CORS allowlist file (JSON array of origins). The gitignored
      # apps/backend/cors.json is mounted read-only below — create it from
      # cors.example.json first, or the API runs with the web-URL fallback.
      CORS_CONFIG_PATH: ${CORS_CONFIG_PATH:-cors.json}
      # Avatar rendering goes through the internal DiceBear service; override
      # with https://api.dicebear.com to use the public API instead.
      AVATAR_API_URL: http://dicebear:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ims_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ims_erp}
      # The Drizzle client connects via POSTGRES_URL only.
      # ponytail: assumes a URL-safe password; add percent-encoding when the
      # password contains @ / : # or other URL delimiters.
      POSTGRES_URL: postgresql://${POSTGRES_USER:-ims_erp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ims_erp}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-1}
      # The Redis client connects via REDIS_URL only.
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BETTER_AUTH_SECRET: ${APP_SECRET:?APP_SECRET is required (used as BETTER_AUTH_SECRET)}
    ports:
      # Host 3001 by default: host port 3000 is commonly taken by a local dev
      # server. Override with APP_PORT in .env.
      - "${APP_PORT:-3001}:3000"
    volumes:
      # Host-specific CORS allowlist lives outside the image. If the file is
      # missing, Compose creates a directory at this path — the loader treats
      # that as "unset" and falls back to APP_WEB_URL/APP_URL.
      - ./apps/backend/cors.json:/app/apps/backend/cors.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dicebear:
        condition: service_healthy

  web-admin:
    image: ghcr.io/okifirsyah404/ims-erp-web-admin:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      # Host 8080 by default: host port 80 is commonly taken by a local
      # reverse proxy (e.g. Caddy). Override with WEB_ADMIN_PORT in .env.
      - "${WEB_ADMIN_PORT:-8080}:80"

  # Employee self-service portal (apps/web-employee-portal). Same static
  # bundle as web-admin; 8081 keeps both running side by side.
  web-employee-portal:
    image: ghcr.io/okifirsyah404/ims-erp-web-employee-portal:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_EMPLOYEE_PORTAL_PORT:-8081}:80"

  # Public website (apps/web-landing). Node standalone server on 4321 inside
  # the container. Reaches the ERP server-to-server over the internal network.
  web-landing:
    image: ghcr.io/okifirsyah404/ims-erp-landing:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Jakarta}
      # Runtime (server) settings. ERP_API_BASE_URL is the backend root reached
      # from inside the compose network.
      ERP_API_BASE_URL: ${WEB_LANDING_ERP_API_BASE_URL:-http://backend:3000}
      ERP_API_TOKEN: ${WEB_LANDING_ERP_API_TOKEN:-}
      WEB_DATA_SOURCE: ${WEB_LANDING_DATA_SOURCE:-erp}
      # The backend wraps every response as { requestId, status, message, timestamp, data }.
      ERP_RESPONSE_ENVELOPE: ${WEB_LANDING_ERP_RESPONSE_ENVELOPE:-data}
      ERP_RFQ_PATH: ${WEB_LANDING_ERP_RFQ_PATH:-}
      CUSTOMER_INTERNAL_URL: ${CUSTOMER_INTERNAL_URL:-http://web-customer-portal:4322}
      WEB_HANDOFF_SECRET: ${WEB_HANDOFF_SECRET:-}
    ports:
      # Host 4321 matches the dev port. Override with WEB_LANDING_PORT in .env.
      - "${WEB_LANDING_PORT:-4321}:4321"
    depends_on:
      backend:
        condition: service_started
    # Build-time client values are inlined into the bundle; the image is built
    # with the same values (see docker-compose.local.yml), not read here.

  # Customer portal (apps/web-customer-portal). Node standalone server on 4322.
  # Sessions live in the server; the cookie holds only an opaque id.
  web-customer-portal:
    image: ghcr.io/okifirsyah404/ims-erp-customer-portal:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Jakarta}
      ERP_API_BASE_URL: ${PORTAL_ERP_API_BASE_URL:-http://backend:3000}
      ERP_API_TOKEN: ${PORTAL_ERP_API_TOKEN:-}
      PORTAL_DATA_SOURCE: ${PORTAL_DATA_SOURCE:-erp}
      ERP_RESPONSE_ENVELOPE: ${PORTAL_ERP_RESPONSE_ENVELOPE:-data}
      ERP_ASSET_ORIGINS: ${PORTAL_ERP_ASSET_ORIGINS:-}
      WEB_HANDOFF_SECRET: ${WEB_HANDOFF_SECRET:-}
    ports:
      # Host 4322 matches the dev port. Override with WEB_CUSTOMER_PORTAL_PORT in .env.
      - "${WEB_CUSTOMER_PORTAL_PORT:-4322}:4322"
    volumes:
      # Server-side sessions (Astro's fsLite driver) persist across restarts.
      - portal-sessions:/app/.astro/session
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  portal-sessions:
